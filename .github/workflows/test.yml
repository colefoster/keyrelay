name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Linux only: on GitHub's macOS runners, signals forwarded through the Node launcher
    # never reach the runner, so the cancellation tests wait out the five-minute expiry.
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python -m unittest discover -s tests -v
